<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LingoLife — حياتك. لغتك. ذاكرتك.</title>
  <meta name="description" content="نظام ذاكرة لغوية شخصية — يحوّل مواقف حياتك الحقيقية إلى ذكريات لغوية منظّمة.">

  <meta name="theme-color" content="#F7F4EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LingoLife">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/journal.css">
  <link rel="stylesheet" href="./css/audio.css">
  <link rel="stylesheet" href="./css/shadow.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

  <a class="skip-link" href="#app-main">تخطَّ إلى المحتوى</a>

  <header class="app-header">
    <button class="brand" onclick="location.hash='#/'">
      <img class="brand-mark" src="./assets/icons/icon.svg" alt="" width="34" height="34">
      <span class="brand-text">
        <b>LingoLife</b>
        <span>حياتك. لغتك. ذاكرتك.</span>
      </span>
    </button>

    <!--
      ⚠️ رجوعٌ **واحدٌ في القشرة** لا زرٌّ منسوخٌ في كل شاشة. كان في
         ستّ شاشاتٍ من ستّ عشرة، والعشر الباقية تصل إليها ولا تخرج
         منها إلا بالتنقّل الرئيسي — وهو ليس رجوعًا.

         ومكانُه هنا يعني أن أي شاشةٍ تُضاف غدًا تجده جاهزًا.
    -->
    <button class="app-back" id="app-back" data-action="app-back"
            title="رجوع" aria-label="رجوع للشاشة اللي قبلها" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      <span>رجوع</span>
    </button>

    <nav class="app-nav" aria-label="التنقّل الرئيسي">
      <button class="nav-btn" data-nav="now" onclick="location.hash='#/'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>دلوقتي</span>
      </button>
      <button class="nav-btn" data-nav="life" onclick="location.hash='#/life'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        <span>حياتي</span>
      </button>
      <!--
        النهر بجوار «حياتي» لا بدلًا منها: حياتي تجيب «إيه اللي حصل في
        مايو؟» بشبكة بطاقات، والنهر يجيب «إيه اللي حصل بعد إيه وقد إيه
        كان بينهم؟» بترتيبٍ متّصل وفجواتٍ معروضة. سؤالان مختلفان.
      -->
      <button class="nav-btn" data-nav="river" onclick="location.hash='#/river'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7c3-2 5 2 8 0s5-2 8 0M3 12c3-2 5 2 8 0s5-2 8 0M3 17c3-2 5 2 8 0s5-2 8 0"/></svg>
        <span>النهر</span>
      </button>
      <button class="nav-btn" data-nav="language" onclick="location.hash='#/language'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h7"/><path d="m17 15 3 3-3 3"/></svg>
        <span>لغتي</span>
      </button>

      <button class="nav-btn" data-nav="analysis" onclick="location.hash='#/analysis'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>تحليل</span>
      </button>

      <button class="nav-btn" data-nav="search" onclick="location.hash='#/search'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>بحث</span>
      </button>

      <button class="nav-btn secondary divide-before" data-nav="dev" onclick="location.hash='#/dev'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.5 18a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 9.5V3"/><path d="M8 14h8"/></svg>
        <span>مختبر التطوّر</span>
      </button>

      <button class="nav-btn secondary" data-nav="studio" onclick="location.hash='#/studio'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/><path d="M17 4v6M20 7h-6"/></svg>
        <span>الاستوديو</span>
      </button>

      <button class="nav-btn secondary" data-nav="duplicates" onclick="location.hash='#/duplicates'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"/><path d="M9 21h10a2 2 0 0 0 2-2V9"/></svg>
        <span>المكرَّر</span>
      </button>

      <button class="nav-btn secondary" data-nav="trash" onclick="location.hash='#/trash'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        <span>سلة المهملات</span>
      </button>
      <button class="nav-btn secondary" data-nav="settings" onclick="location.hash='#/settings'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span>الإعدادات</span>
      </button>
    </nav>

    <!-- يظهر على الشاشات الكبيرة فقط -->
    <div class="sidebar-foot">
      <div class="side-card" id="storage-card" data-action="go-settings" role="button" tabindex="0">
        <div class="label">التخزين على الجهاز</div>
        <div class="meter"><span style="width:1%"></span></div>
        <div class="value" data-storage-text>—</div>
      </div>
    </div>

    <!-- أدوات الهيدر على الهاتف -->
    <div class="header-actions">
      <button class="icon-btn" title="سلة المهملات" aria-label="سلة المهملات" onclick="location.hash='#/trash'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
      </button>
      <button class="icon-btn" title="الإعدادات" aria-label="الإعدادات" onclick="location.hash='#/settings'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main" id="app-main">
    <div class="loading"><span class="spinner"></span> بيفتح ذاكرتك…</div>
  </main>

  <button class="fab" id="fab" data-action="new-scene" title="أضف ذكرى" aria-label="أضف ذكرى" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!--
    ⚠️ «طوّر ده» على **كل** شاشة، وده مقصود: الملاحظة تتكتب حيث
       رأيتها. تفتح شاشة تانية عشان تكتب عن دي يعني تفقد المكان
       وتنسى إيه كان بالظبط.
  -->
  <button class="improve-fab" id="improve-fab" data-action="improve"
          title="طوّر ده" aria-label="سجّل ملاحظة تطوير عن الشاشة دي">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
  </button>

  <noscript>
    <div style="padding:40px 20px;text-align:center">
      LingoLife محتاج JavaScript يشتغل. فعّله من إعدادات المتصفح.
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
