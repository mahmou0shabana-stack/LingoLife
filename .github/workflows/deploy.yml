name: نشر LingoLife على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في المرة. لا نلغي نشرة جارية حتى لا يبقى الموقع نصف محدَّث.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: ختم رقم البناء
        # يستبدل __BUILD__ في service-worker.js و js/config.js.
        # رقم البناء هو اسم الكاش — تغييره يجعل المتصفح يجلب الكود الجديد
        # ويحذف الكاش القديم، بلا أي مساس بـ IndexedDB.
        run: |
          BUILD="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "رقم البناء: $BUILD"
          sed -i "s/__BUILD__/$BUILD/g" service-worker.js js/config.js
          grep -n "$BUILD" service-worker.js js/config.js

      - name: فحص سريع لصحة الملفات
        run: |
          set -e
          for f in index.html manifest.webmanifest service-worker.js js/app.js; do
            test -f "$f" || { echo "ملف ناقص: $f"; exit 1; }
          done
          # التأكد من أن الـ JSON سليم
          python3 -c "import json;json.load(open('manifest.webmanifest'))"
          # التأكد من عدم بقاء أي placeholder
          ! grep -rq "__BUILD__" service-worker.js js/config.js
          echo "✓ الفحص تمام"

      - name: التأكد من تفعيل GitHub Pages
        # ⚠️ التفعيل خطوة يدوية لمرة واحدة لا يستطيعها هذا الـ workflow.
        #    جُرّب `enablement: true` فرفضه GitHub:
        #      Create Pages site failed — Resource not accessible by integration
        #    السبب: توكن Actions يملك Pages: write لكن **إنشاء** موقع Pages
        #    يتطلّب صلاحية إدارية لا تُمنح للتوكن. مالك المستودع وحده يفعّلها.
        #
        #    هذه الخطوة تشرح ذلك بالعربية بدل خطأ API غامض بعد ثلاث خطوات.
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages غير مفعّل::خطوة يدوية مطلوبة لمرة واحدة"
            echo ""
            echo "  Pages لسه متفعّلش على المستودع، والنشر مش هيشتغل من غيره."
            echo ""
            echo "  افتح: https://github.com/${{ github.repository }}/settings/pages"
            echo "  وتحت Source اختار: GitHub Actions"
            echo ""
            echo "  وبعدين شغّل الـ workflow ده تاني من تبويب Actions."
            echo "  مرة واحدة بس — بعدها كل دفعة على main هتنشر لوحدها."
            exit 1
          fi

          echo "✓ Pages مفعّل (HTTP $status)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
